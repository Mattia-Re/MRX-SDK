name: Run .NET Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_call: # lets publish.yml require this workflow before publishing (covers push-to-main runs)

defaults:
  run:
    working-directory: ./src

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore MRX.slnx

    - name: Build
      run: dotnet build MRX.slnx --no-restore -c Release

    - name: Run tests
      run: dotnet test MRX.slnx --no-build -c Release --verbosity normal
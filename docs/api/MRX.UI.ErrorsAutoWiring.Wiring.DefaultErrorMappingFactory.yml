  summary: Builds a map of field identifiers to their associated coded errors.
  example: []
  syntax:
    content: public Dictionary<FieldIdentifier, List<CodedError>> CreateErrorFieldMap(EditContext editContext, Dictionary<string, CodedError[]> errors, HttpResponseMessage response)

  summary: A delegate that maps coded errors from an HTTP response onto the fields of an <xref href="Microsoft.AspNetCore.Components.Forms.EditContext" data-throw-if-not-resolved="false"></xref>'s model.
  example: []
  syntax:
    content: public delegate Dictionary<FieldIdentifier, List<CodedError>> ProblemDetailsHttpClientOptions.ErrorMappingFactoryHandler(EditContext editContext, Dictionary<string, CodedError[]> errors, HttpResponseMessage response)
    parameters:
    - id: editContext
      type: Microsoft.AspNetCore.Components.Forms.EditContext
      description: The edit context whose model the errors should be mapped against.
    - id: errors
      type: System.Collections.Generic.Dictionary{System.String,MRX.Core.Common.ModelBinding.CodedError[]}
      description: The coded errors, keyed by the server-provided error key.
    - id: response
      type: System.Net.Http.HttpResponseMessage
      description: The HTTP response the errors were extracted from.
    return:
      type: System.Collections.Generic.Dictionary{Microsoft.AspNetCore.Components.Forms.FieldIdentifier,System.Collections.Generic.List{MRX.Core.Common.ModelBinding.CodedError}}
      description: A dictionary linking each resolved field identifier to the list of errors that apply to it.

  assemblies:
  - MRX.Parsing.Reflection
  namespace: MRX.Parsing.Reflection
  summary: Parses <code class="paramref">token</code> into a value of <code class="paramref">numericType</code>.
  example: []
  syntax:
    content: public object Parse(Type numericType, string token, IFormatProvider? provider = null)
    parameters:
    - id: numericType
      type: System.Type
      description: The numeric type to parse the token into. Must implement <xref href="System.Numerics.INumber%601" data-throw-if-not-resolved="false"></xref>.
    - id: token
      type: System.String
      description: The string representation of the value to parse.
    - id: provider
      type: System.IFormatProvider
      description: An optional format provider used to interpret <code class="paramref">token</code>.
    return:
      type: System.Object
      description: The parsed value, boxed as <xref href="System.Object" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Function Parse(numericType As Type, token As String, provider As IFormatProvider = Nothing) As Object
  overload: MRX.Parsing.Reflection.NumericParser.Parse*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">numericType</code> or <code class="paramref">token</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: <code class="paramref">numericType</code> does not implement <xref href="System.Numerics.INumber%601" data-throw-if-not-resolved="false"></xref>.

  assemblies:
  - MRX.Json.Reflection
  namespace: MRX.Json.Reflection.Abstractions
  summary: Determines whether this accessor is able to resolve <code class="paramref">token</code> against <code class="paramref">container</code>.
  example: []
  syntax:
    content: bool CanHandle(JsonPathTokenType tokenType, string token, object container)
    parameters:
    - id: tokenType
      type: MRX.Json.Path.JsonPathTokenType
      description: The kind of path token being resolved (property, array index, etc.).
    - id: token
      type: System.String
      description: The raw token text extracted from the JSON path.
    - id: container
      type: System.Object
      description: The object instance the token should be resolved against.
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if this accessor can handle the token; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.

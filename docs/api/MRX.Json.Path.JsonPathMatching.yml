    arguments:
    - type: System.String
      value: (?<property>\w+)|\[(?:(?<quote>["'])(?<str_idx>.+)\k<quote>|(?<num_idx>\d+))\]
    - type: System.Text.RegularExpressions.RegexOptions
      value: 0
    - type: System.Int32
      value: 1000

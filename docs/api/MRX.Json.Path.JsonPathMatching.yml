- uid: MRX.Json.Path.JsonPathMatching.JsonPathTokens
  commentId: M:MRX.Json.Path.JsonPathMatching.JsonPathTokens
  id: JsonPathTokens
  parent: MRX.Json.Path.JsonPathMatching
  langs:
  - csharp
  - vb
  name: JsonPathTokens()
  nameWithType: JsonPathMatching.JsonPathTokens()
  fullName: MRX.Json.Path.JsonPathMatching.JsonPathTokens()
  type: Method
  source:
    remote:
      path: src/MRX.Json/src/MRX.Json/Path/JsonPathMatching.cs
      branch: main
      repo: https://github.com/Mattia-Re/MRX-SDK.git
    id: JsonPathTokens
    path: ../src/MRX.Json/src/MRX.Json/Path/JsonPathMatching.cs
    startLine: 20
  assemblies:
  - MRX.Json
  namespace: MRX.Json.Path
  remarks: >-
    Pattern:<br />


    <pre><code class="lang-csharp">(?&lt;property&gt;\\w+)|\\[(?:(?&lt;quote&gt;["'])(?&lt;str_idx&gt;.+)\\k&lt;quote&gt;|(?&lt;num_idx&gt;\\d+))\\]</code></pre>


    <br />

    Explanation:<br />


    <pre><code class="lang-csharp">○ Match with 2 alternative expressions, atomically.
        ○ "property" capture group.
            ○ Match a word character atomically at least once.
        ○ Match a sequence of expressions.
            ○ Match '['.
            ○ Match with 2 alternative expressions.
                ○ Match a sequence of expressions.
                    ○ "quote" capture group.
                        ○ Match a character in the set ["'].
                    ○ "str_idx" capture group.
                        ○ Match a character other than '\n' greedily at least once.
                    ○ Match the same text as matched by the "quote" capture group.
                ○ "num_idx" capture group.
                    ○ Match a Unicode digit atomically at least once.
            ○ Match ']'.</code></pre>
  example: []
  syntax:
    content: >-
      [GeneratedRegex("(?<property>\\w+)|\\[(?:(?<quote>[\"'])(?<str_idx>.+)\\k<quote>|(?<num_idx>\\d+))\\]", RegexOptions.None, 1000)]

      public static Regex JsonPathTokens()
    return:
      type: System.Text.RegularExpressions.Regex
    content.vb: >-
      <GeneratedRegex("(?<property>\w+)|\[(?:(?<quote>[""'])(?<str_idx>.+)\k<quote>|(?<num_idx>\d+))\]", RegexOptions.None, 1000)>

      Public Shared Function JsonPathTokens() As Regex
  overload: MRX.Json.Path.JsonPathMatching.JsonPathTokens*
